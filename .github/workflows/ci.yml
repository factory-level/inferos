name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer PR revision supersedes its older CI run. Keep every main push independent so
# cancellation and pending-run replacement apply only to PRs, never to landed revisions.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation and design references
        run: bash scripts/check-docs.sh

  contract:
    name: Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Check the consumer contract
        run: node scripts/consumer/check-contract.ts

  # Factory node 1, the reusable layer (.github/workflows/_verify.yml + .github/actions/*). Its jobs
  # keep the names Lint and "Build and test"; as called jobs GitHub reports them as
  # "verify / Lint" and "verify / Build and test", so required status checks must name those.
  verify:
    name: verify
    uses: ./.github/workflows/_verify.yml
    with:
      node-version: "24.19.0"
