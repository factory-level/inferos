name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer PR revision supersedes its older CI run. Keep every main push independent so
# cancellation and pending-run replacement apply only to PRs, never to landed revisions.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Factory node 1, the reusable layer (.github/workflows/_verify.yml + .github/actions/*). Its jobs
  # keep the names Lint and "Build and test"; as called jobs GitHub reports them as
  # "verify / Lint" and "verify / Build and test", so required status checks must name those.
  verify:
    name: verify
    uses: ./.github/workflows/_verify.yml
    with:
      node-version: "24.19.0"
