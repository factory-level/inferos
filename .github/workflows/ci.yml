name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer PR revision supersedes its older CI run. Keep every main push independent so
# cancellation and pending-run replacement apply only to PRs, never to landed revisions.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"

jobs:
  # Parallel to `test` so lint and test failures surface on the same run. Package type checking
  # lives in Build; `scripts/` is checked here instead, because it is deliberately kept off
  # `pnpm build`'s hot path (see AGENTS.md) and this is the cheap job.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ downloads its own pnpm for `vp install` and exposes no shim, so this is what puts
      # `pnpm` on PATH for the steps below.
      - name: Enable Corepack
        run: corepack enable

      # Vite+ resolves its own version from the `vite-plus` catalog entry, and installs the pnpm
      # named in `packageManager` (integrity hash checked as Corepack does), so setup-node is not
      # needed.
      #
      # No `cache` here, unlike `test`: this job is fast anyway, and both caching
      # means they race to reserve the same lockfile-keyed entry.
      # TODO(someday): It would be great if the setup-vp action could share a cache key with the test job but disable writes to cache
      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
          run-install: true

      - name: Lint
        run: pnpm lint:check

      - name: Type-check scripts/
        run: pnpm types:scripts

      - name: Check generated worker configs
        run: pnpm configs:check

  # Documentation structure and the InferOps design references (docs/adr/0010). Needs no install.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check documentation and design references
        run: bash scripts/check-docs.sh

  # The consumer side of the cross-repo contract gate (FAC-142): the gatekeeper's InferOps pin is the
  # revision the board schema was generated at, and every package pins the one AG-UI version
  # scripts/consumer/contract.json declares. Needs no install and no secret, so a fork's pull request
  # runs it too. InferOps' CI holds the producer side to the same declaration.
  contract:
    name: Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check the consumer contract
        run: node scripts/consumer/check-contract.ts

  test:
    name: Build and test
    runs-on: ubuntu-latest
    # Without an explicit cap a wedged test process (a spawned child that outlives its reap keeps
    # `node --test` alive forever) burns the 6-hour default instead of failing, on every run of the
    # branch. 25 minutes leaves room for the 900 s per-command backstop
    # (`TOTAL_TIMEOUT_SECONDS`, scripts/vitest-task-vite-config.ts) to fire first: about 1.5 minutes of
    # checkout, install and build, the backend run starting about 1.3 minutes into the Test step, then
    # up to 15 minutes before the backstop -- about 18 minutes in all. The backstop then reports which
    # command hung, instead of GitHub cancelling the job.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ downloads its own pnpm for `vp install` and exposes no shim, so this is what puts
      # `pnpm` on PATH for the steps below.
      - name: Enable Corepack
        run: corepack enable

      # Vite+ resolves its own version from the `vite-plus` catalog entry, and installs the pnpm
      # named in `packageManager` (integrity hash checked as Corepack does), so setup-node is not
      # needed.
      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: true

      # Codegen, the frontend/SPA bundles, and the repo's single type check (`types:check` aliases this).
      - name: Set up Bun for the local OpenAI companion
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Build
        run: pnpm build

      # Touched just before the tests so the failure report below can tell this step's vp summary and
      # phase log from an earlier invocation's (scripts/vp/last-run-report.ts).
      - name: Mark the test step start
        run: touch "$RUNNER_TEMP/test-step-started"

      - name: Test
        id: test
        run: pnpm test
        # The Gadget request probes run in real Chrome (GadgetUI.request-probes.test.ts), and with this
        # set a runner without Chrome fails the test step instead of skipping them silently (FAC-15 S3).
        # ubuntu-latest ships Google Chrome at the path the test defaults to.
        env:
          GADGET_BROWSER_TESTS_REQUIRED: "1"

      # Diagnosis only, and only after the Test step itself failed: that same run's per-task outcomes
      # and the integration suite's file-only phase timings. Read only; it always exits 0, so the job
      # keeps the Test step's failure and gains no new one.
      - name: Report the failed test run
        if: failure() && steps.test.outcome == 'failure'
        run: node scripts/vp/last-run-report.ts --since "$RUNNER_TEMP/test-step-started"
