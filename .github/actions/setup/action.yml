name: Set up the InferOS toolchain
description: >-
  Corepack (puts pnpm on PATH), Vite+ with Node.js and the workspace install, and optionally Bun
  for the local OpenAI companion tests. Shared by every job of the reusable workflows.
inputs:
  node-version:
    description: Node.js version for Vite+ to install.
    required: true
  cache:
    description: Whether setup-vp caches the dependency store ("true" or "false").
    required: false
    default: "false"
  bun:
    description: Also install Bun ("true" or "false").
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Vite+ downloads its own pnpm for `vp install` and exposes no shim, so this is what puts
    # `pnpm` on PATH for the steps below.
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    # Vite+ resolves its own version from the `vite-plus` catalog entry, and installs the pnpm
    # named in `packageManager` (integrity hash checked as Corepack does), so setup-node is not
    # needed.
    - name: Set up Vite+, Node.js and dependencies
      uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' }}
        run-install: true

    - name: Set up Bun for the local OpenAI companion
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.11"
